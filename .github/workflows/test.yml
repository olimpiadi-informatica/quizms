name: Code quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: "2.4.2"

      - name: Run biome
        run: biome ci

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: true

      # quizms-mdx and quizms-firebase import @olinfo/quizms from its built `dist/`.
      - name: Build
        run: pnpm -r --filter "./packages/*" build

      - name: Run tests
        run: pnpm test

  test-emulator:
    name: Firebase emulator tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: true

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Build
        run: pnpm -r --filter "./packages/*" build

      - name: Run emulator tests
        run: pnpm test:emulator

  test-e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: true

      - name: Build
        run: pnpm -r --filter "./packages/*" build

      # Use the Playwright version that @olinfo/quizms depends on.
      - name: Install Chromium
        run: pnpm --filter @olinfo/quizms exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e
